<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b10" />
  <title>SwiftGo - Super Admin Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin-style.css?v=20260722a" />
</head>
<body>
  <main class="admin-shell">
    <section class="admin-hero">
      <div class="admin-card">
        <div class="admin-card__mark" aria-hidden="true">SG</div>
        <p class="admin-card__eyebrow">Operations Console</p>
        <h1>SwiftGo - Super Admin Command Center</h1>
        <p class="admin-card__copy">
          Secure access for fleet oversight, partner approvals, and live ride operations.
        </p>
        <button type="button" class="admin-google-btn" id="adminGoogleLoginBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.91h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.4Z"/>
            <path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.37l-3.24-2.54c-.9.6-2.05.96-3.38.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.62A10 10 0 0 0 12 22Z"/>
            <path fill="#FBBC05" d="M6.39 13.92A6.01 6.01 0 0 1 6.08 12c0-.67.11-1.32.31-1.92V7.46H3.04A10 10 0 0 0 2 12c0 1.61.38 3.14 1.04 4.54l3.35-2.62Z"/>
            <path fill="#EA4335" d="M12 5.95c1.47 0 2.79.51 3.82 1.5l2.87-2.87A9.64 9.64 0 0 0 12 2a10 10 0 0 0-8.96 5.46l3.35 2.62C7.18 7.71 9.39 5.95 12 5.95Z"/>
          </svg>
          <span>Login via Google</span>
        </button>
        <p class="admin-card__status" id="adminAuthStatus" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script type="module" src="js/admin-app.js?v=20260722a"></script>
</body>
</html>
